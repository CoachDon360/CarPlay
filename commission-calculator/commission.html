<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Commission" />
  <title>Commission Calculator</title>
  <link rel="stylesheet" href="commission.css" />
</head>
<body>
  <main class="app-shell">
    <section class="card">
      <div class="eyebrow">REAL ESTATE</div>
      <h1>Commission Calculator</h1>
      <p class="subtitle">Enter the sales price and commission percentage.</p>

      <div class="inputs">
        <label>
          <span>Sales Price</span>
          <div class="input-wrap">
            <span class="prefix">$</span>
            <input id="salesPrice" type="number" inputmode="decimal" min="0" step="1000" placeholder="350000" />
          </div>
        </label>

        <label>
          <span>Commission</span>
          <div class="input-wrap">
            <input id="commissionRate" type="number" inputmode="decimal" min="0" step="0.1" placeholder="3" />
            <span class="suffix">%</span>
          </div>
        </label>
      </div>

      <div class="results" aria-live="polite">
        <div class="row">
          <span>Company Gross</span>
          <strong id="companyGross">$0.00</strong>
        </div>
        <div class="row">
          <span>Transaction Fee</span>
          <strong id="transactionFee">$0.00</strong>
        </div>
        <div class="row">
          <span>Agent Gross</span>
          <strong id="agentGross">$0.00</strong>
        </div>
        <div class="row">
          <span>Giving</span>
          <strong id="giving">$0.00</strong>
        </div>
        <div class="row">
          <span>Taxes</span>
          <strong id="taxes">$0.00</strong>
        </div>

        <div class="net-card">
          <span>Agent Net</span>
          <strong id="agentNet">$0.00</strong>
        </div>
      </div>

      <button id="clearButton" type="button">Clear</button>
    </section>
  </main>

  <script src="commission.js"></script>
</body>
</html>
