<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HD Radio</title>
<style>
:root{
  --bg:#08111f;
  --panel:#101a2b;
  --panel-hover:#152239;
  --panel-soft:#0d1727;
  --line:#25324a;
  --text:#f6f8fc;
  --muted:#9aa7bc;
  --accent:#4a86ff;
  --accent-soft:rgba(74,134,255,.15);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
button{font:inherit}
.app-shell{width:min(100%,1180px);padding:30px 32px 42px}
.topbar{display:flex;align-items:center;min-height:56px}
.topbar h1{margin:0;font-size:clamp(1.5rem,3vw,2.25rem);letter-spacing:.01em;font-weight:650;display:flex;align-items:center;gap:.10rem}
.topbar .signal{
  display:inline-flex;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
  height:1.55em;
  margin-right:.06rem;
}
.topbar .signal .wave{
  display:block;
  flex:0 0 auto;
  border-left:3px solid #ff9d00;
  border-radius:50%;
}
.topbar .signal .wave-1{width:18px;height:42px}
.topbar .signal .wave-2{width:14px;height:32px}
.topbar .signal .wave-3{width:10px;height:22px}
.topbar .hd{color:#ff9d00;font-weight:780;font-style:italic}
.topbar .radio-word{color:var(--text);font-style:italic;font-weight:500}
.header-divider{
  height:2px;
  margin:0;
  background:linear-gradient(
    to right,
    transparent 0%,
    #ff9d00 8%,
    #ff9d00 92%,
    transparent 100%
  );
}

.radio-panel{display:grid;grid-template-columns:minmax(0,40%) 2px minmax(0,60%);gap:0;min-height:500px;border:1px solid var(--line);border-radius:22px;background:#0b1524;overflow:hidden}
.station-pane{padding:16px;max-height:72vh;overflow-y:auto}
.vertical-divider{background:linear-gradient(to bottom, transparent 0%, var(--accent) 8%, var(--accent) 92%, transparent 100%)}
.station-list{display:grid;gap:9px}
.station-row{width:100%;min-height:70px;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);text-align:left;cursor:pointer;transition:background 140ms ease,border-color 140ms ease,transform 140ms ease}
.station-row:hover,.station-row:focus-visible{background:var(--panel-hover);border-color:#3a4b68;outline:none}
.station-row:active{transform:scale(.995)}
.station-row.selected{border-color:var(--accent);background:var(--accent-soft)}
.station-row.selected span{color:#ff9d00}
.station-row span,.station-row small{display:block}
.station-row span{font-size:clamp(1.05rem,1.8vw,1.32rem);font-weight:730}
.station-row small{margin-top:4px;color:var(--muted);font-size:clamp(.82rem,1.3vw,.94rem);line-height:1.25}

.now-playing{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  padding:44px 54px;
  min-width:0;
  background:
    radial-gradient(circle at 18% 12%, rgba(99,81,170,.28), transparent 34%),
    radial-gradient(circle at 88% 78%, rgba(63,48,130,.26), transparent 40%),
    linear-gradient(135deg,#2b255f 0%,#282357 45%,#211d49 100%);
}
.eyebrow{margin:0 0 10px;color:var(--accent);font-size:.88rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.station-title{margin:0;font-size:clamp(2rem,4vw,3.5rem);line-height:1.04;font-weight:790;letter-spacing:-.02em;overflow-wrap:anywhere}
.station-description{margin:14px 0 0;max-width:620px;color:var(--muted);font-size:clamp(1rem,1.8vw,1.2rem);line-height:1.45}
.meta-card{width:100%;margin:32px 0 28px;padding:20px 0;border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16)}
.meta-label{display:block;margin-bottom:6px;color:var(--muted);font-size:.83rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.meta-main{display:block;font-size:clamp(1.05rem,1.8vw,1.25rem);font-weight:700}
.meta-sub{display:block;margin-top:8px;color:var(--muted);font-size:.95rem}
.meta-sub.artist-line{color:var(--text);font-size:1.05rem;font-weight:650}
.meta-sub.artist-line::before{content:"ARTIST  ";color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.10em}
.controls{display:flex;align-items:center;gap:18px}
.play-button{width:92px;height:92px;border:none;border-radius:50%;background:var(--accent);color:white;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform 120ms ease,filter 120ms ease}
.play-button:hover{filter:brightness(1.08)}
.play-button:active{transform:scale(.97)}
.play-icon{width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:22px solid currentColor;margin-left:6px}
.pause-icon{display:none;width:26px;height:30px;position:relative}
.pause-icon::before,.pause-icon::after{content:"";position:absolute;top:0;bottom:0;width:8px;border-radius:2px;background:currentColor}
.pause-icon::before{left:1px}.pause-icon::after{right:1px}
.play-button.playing .play-icon{display:none}
.play-button.playing .pause-icon{display:block}
.control-text{min-width:0}
.control-title{font-size:1.05rem;font-weight:760}
.control-status{margin-top:4px;color:var(--muted);font-size:.94rem}

@media(max-width:820px){
  .app-shell{padding:22px 16px 32px}
  .radio-panel{grid-template-columns:1fr;min-height:0}
  .vertical-divider{height:2px;background:linear-gradient(to right,transparent 0%,var(--accent) 8%,var(--accent) 92%,transparent 100%)}
  .now-playing{padding:28px 22px 34px}
  .station-pane{padding:14px}
  .play-button{width:80px;height:80px}
}
</style>
</head>
<body>
<main class="app-shell">
  <header class="topbar"><h1><span class="signal" aria-hidden="true"><span class="wave wave-1"></span><span class="wave wave-2"></span><span class="wave wave-3"></span></span><span class="hd">HD</span> <span class="radio-word">Radio</span></h1></header>
  <div class="header-divider" aria-hidden="true"></div>

  <section class="radio-panel">
    <div class="station-pane">
      <div class="station-list active" id="all-stations">
<button class="station-row" data-category-label="Pop" data-stream="https://listen.181fm.com/181-goodtime_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-goodtime_128k.mp3" data-meta-format="ice"><span>Good Time Oldies</span><small>Oldies &amp; feel-good favorites</small></button>
        <button class="station-row" data-category-label="Pop" data-stream="https://listen.181fm.com/181-soul_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-soul_128k.mp3" data-meta-format="ice"><span>Soul</span><small>Classic soul &amp; R&amp;B</small></button>
        <button class="station-row" data-category-label="Pop" data-stream="https://listen.181fm.com/181-beatles_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-beatles_128k.mp3" data-meta-format="ice"><span>Beatles</span><small>The Beatles &amp; related favorites</small></button>
        <button class="station-row" data-category-label="Pop" data-stream="https://listen.181fm.com/181-lite80s_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-lite80s_128k.mp3" data-meta-format="ice"><span>Lite 80s</span><small>Softer hits from the 1980s</small></button>
        <button class="station-row" data-category-label="Pop" data-stream="https://listen.181fm.com/181-lite90s_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-lite90s_128k.mp3" data-meta-format="ice"><span>Lite 90s</span><small>Smooth 1990s pop</small></button>
        <button class="station-row" data-category-label="Pop" data-stream="https://listen.181fm.com/181-yachtrock_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-yachtrock_128k.mp3" data-meta-format="ice"><span>Yacht Rock</span><small>Smooth 70s &amp; 80s</small></button>
        <button class="station-row" data-category-label="Pop" data-stream="https://listen.181fm.com/181-mellow_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-mellow_128k.mp3" data-meta-format="ice"><span>Mellow Gold</span><small>Soft rock classics</small></button>
        <button class="station-row" data-category-label="Rock" data-stream="https://listen.181fm.com/181-eagle_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-eagle_128k.mp3" data-meta-format="ice"><span>The Eagle</span><small>Classic rock</small></button>
        <button class="station-row" data-category-label="Rock" data-stream="https://listen.181fm.com/181-rock40_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-rock40_128k.mp3" data-meta-format="ice"><span>Rock 40</span><small>Rock &amp; roll hits</small></button>

        <button class="station-row" data-category-label="Easy" data-stream="https://listen.181fm.com/181-breeze_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-breeze_128k.mp3" data-meta-format="ice"><span>The Breeze</span><small>Relaxed easy favorites</small></button>
        <button class="station-row" data-category-label="Easy" data-stream="https://listen.181fm.com/181-classicalguitar_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-classicalguitar_128k.mp3" data-meta-format="ice"><span>Classical Guitar</span><small>Gentle instrumental guitar</small></button>
        <button class="station-row" data-category-label="Easy" data-stream="https://listen.181fm.com/181-classicaljazz_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-classicaljazz_128k.mp3" data-meta-format="ice"><span>Classical Jazz</span><small>Smooth jazz selections</small></button>
        <button class="station-row" data-category-label="Easy" data-stream="https://listen.181fm.com/181-classical_128k.mp3" data-meta-host="listen.181fm.com" data-meta-port="7080" data-meta-id="181-classical_128k.mp3" data-meta-format="ice"><span>Classical Music</span><small>Timeless classical works</small></button>
      </div>
      </div>
    </div>

    <div class="vertical-divider" aria-hidden="true"></div>

    <aside class="now-playing" aria-live="polite">
<h2 class="station-title" id="stationTitle">Choose a station</h2>
      <p class="station-description" id="stationDescription">Tap any station on the left to start listening.</p>

      <div class="meta-card">
        <span class="meta-label">Now Playing</span>
        <span class="meta-main" id="metaMain">No station selected</span>
        <span class="meta-sub" id="metaSub">Song and artist metadata can live here when the stream provides it.</span>
      </div>

      <div class="controls">
        <button class="play-button" id="playButton" aria-label="Play" disabled>
          <span class="play-icon" aria-hidden="true"></span>
          <span class="pause-icon" aria-hidden="true"></span>
        </button>
        <div class="control-text">
          <div class="control-title" id="controlTitle">Select a station</div>
          <div class="control-status" id="controlStatus">Ready</div>
        </div>
      </div>
    </aside>
  </section>
</main>

<audio id="radioPlayer" preload="auto"></audio>
<script>
const rows = document.querySelectorAll('.station-row');
const player = document.getElementById('radioPlayer');
const playButton = document.getElementById('playButton');
const stationTitle = document.getElementById('stationTitle');
const stationDescription = document.getElementById('stationDescription');
const metaMain = document.getElementById('metaMain');
const metaSub = document.getElementById('metaSub');
const controlTitle = document.getElementById('controlTitle');
const controlStatus = document.getElementById('controlStatus');
let currentRow = null;
let metadataTimer = null;
let metaSeq = 1;

function setPlayingUI(isPlaying){
  playButton.classList.toggle('playing', isPlaying);
  playButton.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  if(currentRow){
    const name = currentRow.querySelector('span').textContent.trim();
    controlTitle.textContent = isPlaying ? 'Playing' : 'Paused';
    controlStatus.textContent = name;
  }
}


function stopMetadataPolling(){
  if(metadataTimer){
    clearInterval(metadataTimer);
    metadataTimer = null;
  }
}

function split181Song(song){
  song = String(song || '').replace(/\.(mp3|wma)$/i,'').trim();

  let delim = " - ";
  if(song.indexOf(delim) < 0) delim = "-";
  if(song.indexOf(delim) < 0) delim = " / ";

  if(song.indexOf(delim) < 0){
    return { artist:"", title:song };
  }

  let artist = song.split(delim)[0].trim();
  let title = song.substring(artist.length + delim.length).trim();

  artist = artist.replace(/^-+|-+$/g,'').trim();
  title = title.replace(/^-+|-+$/g,'').trim();

  return { artist, title };
}

async function fetch181Metadata(){
  if(!currentRow || !currentRow.dataset.metaHost) return;

  const host = currentRow.dataset.metaHost;
  const port = currentRow.dataset.metaPort;
  const id = currentRow.dataset.metaId;
  const format = currentRow.dataset.metaFormat || 'ice';

  const url =
    'https://player.181fm.com/streamdata.php' +
    '?h=' + encodeURIComponent(host) +
    '&p=' + encodeURIComponent(port) +
    '&i=' + encodeURIComponent(id) +
    '&https=' +
    '&f=' + encodeURIComponent(format) +
    '&c=' + (metaSeq++);

  try{
    const response = await fetch(url, { cache:'no-store' });
    if(!response.ok) throw new Error('metadata request failed');

    const json = await response.json();

    if(!currentRow || currentRow.dataset.metaId !== id) return;

    const rawSong = String(json.song || '').trim();
    if(!rawSong) throw new Error('no song metadata');

    const parsed = split181Song(rawSong);

    metaMain.textContent = parsed.title || rawSong;

    if(parsed.artist){
      metaSub.textContent = parsed.artist;
      metaSub.classList.add('artist-line');
    }else{
      metaSub.textContent = 'Live 181 metadata';
      metaSub.classList.remove('artist-line');
    }

  }catch(err){
    if(!currentRow || currentRow.dataset.metaId !== id) return;
    metaMain.textContent = currentRow.querySelector('span').textContent.trim();
    metaSub.textContent = 'Song info unavailable';
    metaSub.classList.remove('artist-line');
  }
}

function startMetadataPolling(){
  stopMetadataPolling();
  fetch181Metadata();
  metadataTimer = setInterval(fetch181Metadata, 20000);
}

function populatePanel(row){
  const name = row.querySelector('span')?.textContent?.trim() || 'Station';
  const description = row.querySelector('small')?.textContent?.trim() || '';
  stationTitle.textContent = name;
  stationDescription.textContent = description;

  stopMetadataPolling();
  metaSub.classList.remove('artist-line');

  if(row.dataset.metaHost){
    metaMain.textContent = 'Loading song info…';
    metaSub.textContent = 'Live song info';
    startMetadataPolling();
  }else{
    metaMain.textContent = name;
    metaSub.textContent = row.dataset.stream
      ? 'Live stream connected.'
      : 'Stream connection coming next.';
  }
}

async function startRow(row){
  const stream = row.dataset.stream;
  const name = row.querySelector('span')?.textContent?.trim() || 'Station';
  rows.forEach(r => r.classList.remove('selected'));
  row.classList.add('selected');
  currentRow = row;
  populatePanel(row);

  if(!stream){
    player.pause();
    player.removeAttribute('src');
    playButton.disabled = true;
    setPlayingUI(false);
    controlTitle.textContent = 'Coming next';
    controlStatus.textContent = `${name} stream is not wired yet`;
    return;
  }

  playButton.disabled = false;
  player.pause();

  // Safari is happier when src is assigned and play() is called directly
  // from the station-button click, without forcing a separate load() first.
  if(player.getAttribute('src') !== stream){
    player.src = stream;
  }

  controlTitle.textContent = 'Connecting';
  controlStatus.textContent = name;

  try{
    await player.play();
    setPlayingUI(true);
  }catch(err){
    console.warn('Initial stream start failed:', err && err.name, err && err.message);

    // A quick retry handles Safari/WebKit AbortError races when switching streams.
    setPlayingUI(false);
    controlTitle.textContent = 'Connecting';
    controlStatus.textContent = name;

    setTimeout(async () => {
      if(currentRow !== row) return;
      try{
        await player.play();
        setPlayingUI(true);
      }catch(retryErr){
        console.warn('Stream retry failed:', retryErr && retryErr.name, retryErr && retryErr.message);
        if(currentRow !== row) return;
        setPlayingUI(false);
        controlTitle.textContent = 'Could not start';
        controlStatus.textContent = name;
      }
    }, 350);
  }
}



rows.forEach(row => row.addEventListener('click', () => {
  if(currentRow === row){
    populatePanel(row);
    return;
  }
  startRow(row);
}));

playButton.addEventListener('click', async () => {
  if(!currentRow || !currentRow.dataset.stream) return;
  const name = currentRow.querySelector('span')?.textContent?.trim() || 'Station';
  if(player.paused){
    try{
      await player.play();
      setPlayingUI(true);
    }catch(err){
      controlTitle.textContent = 'Could not start';
      controlStatus.textContent = name;
    }
  }else{
    player.pause();
    setPlayingUI(false);
  }
});

player.addEventListener('playing', () => setPlayingUI(true));
player.addEventListener('pause', () => {
  if(currentRow) setPlayingUI(false);
});
player.addEventListener('error', () => {
  if(!currentRow) return;
  playButton.classList.remove('playing');
  controlTitle.textContent = 'Unavailable';
  controlStatus.textContent = `${currentRow.querySelector('span').textContent.trim()} is unavailable right now`;
});
</script>
</body>
</html>
