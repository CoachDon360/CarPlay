<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#075a9d">
  <title>Home</title>
  <link rel="stylesheet" href="home.css?v=005">
</head>
<body>
  <main class="home-screen">
    <div class="status" aria-label="Current weather and time">
      <button
        class="weather-trigger"
        id="weather-trigger"
        type="button"
        aria-label="Open 12 hour forecast"
        aria-expanded="false"
        aria-controls="forecast-panel">
        <img id="weather-icon" class="weather-icon" src="weather-sun.svg" alt="">
        <span id="temperature" class="temperature">--°</span>
      </button>
      <time id="home-time">--:--</time>
    </div>

    <button class="forecast-backdrop" id="forecast-backdrop" type="button"
      aria-label="Close 12 hour forecast" tabindex="-1"></button>

    <section class="forecast-panel" id="forecast-panel" aria-hidden="true"
      aria-labelledby="forecast-title">
      <header class="forecast-header">
        <h2 id="forecast-title">12 Hour Forecast</h2>
        <button class="forecast-close" id="forecast-close" type="button"
          aria-label="Close forecast">×</button>
      </header>

      <div class="forecast-strip" id="forecast-strip" aria-live="polite">
        <div class="forecast-loading">Loading forecast…</div>
      </div>

      <footer class="forecast-footer">
        <span>Frankfort, Kentucky</span>
        <span id="forecast-updated"></span>
      </footer>
    </section>

    <section class="home-grid" aria-label="Apps">
      <button class="home-app" type="button" aria-label="Radio">
        <span class="home-icon icon-radio"><span>♪</span></span><span>Radio</span>
      </button>
      <button class="home-app" type="button" aria-label="Disney">
        <span class="home-icon icon-disney"><span>✦</span></span><span>Disney</span>
      </button>
      <button class="home-app" type="button" aria-label="Bible">
        <span class="home-icon icon-bible"><span>✝</span></span><span>Bible</span>
      </button>
      <button class="home-app" type="button" aria-label="Podcasts">
        <span class="home-icon icon-podcasts"><span>◉</span></span><span>Podcasts</span>
      </button>

      <button class="home-app" type="button" aria-label="Maps">
        <span class="home-icon icon-maps"><span>➤</span></span><span>Maps</span>
      </button>
      <button class="home-app" type="button" aria-label="Weather">
        <span class="home-icon icon-weather"><span>☀</span></span><span>Weather</span>
      </button>
      <button class="home-app" type="button" aria-label="Restaurants">
        <span class="home-icon icon-food"><span>⌁</span></span><span>Restaurants</span>
      </button>
      <button class="home-app" type="button" aria-label="Real Estate">
        <span class="home-icon icon-realestate"><span>⌂</span></span><span>Real Estate</span>
      </button>

      <button class="home-app" type="button" aria-label="Streaming">
        <span class="home-icon icon-streaming"><span>▶</span></span><span>Streaming</span>
      </button>
      <button class="home-app" type="button" aria-label="Tesla">
        <span class="home-icon icon-tesla"><span>T</span></span><span>Tesla</span>
      </button>
      <button class="home-app" type="button" aria-label="Favorites">
        <span class="home-icon icon-favorites"><span>★</span></span><span>Favorites</span>
      </button>
      <button class="home-app" type="button" aria-label="Settings">
        <span class="home-icon icon-settings"><span>⚙</span></span><span>Settings</span>
      </button>
    </section>
  </main>
  <script src="home.js?v=005"></script>
</body>
</html>
