<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071a3d">
  <title>Park Music</title>
  <link rel="stylesheet" href="park-music.css?v=001">
</head>
<body>
  <main class="park-player">
    <div class="shade" aria-hidden="true"></div>

    <section class="player-card" aria-label="Park Music player">
      <div class="copy">
        <p class="eyebrow">PARK MUSIC</p>
        <h1 id="track-title">Park World Radio</h1>
        <p id="track-meta" class="metadata">Tap play to begin</p>
      </div>

      <button id="play-button" class="mouse-control" type="button" aria-label="Play Park Music" aria-pressed="false">
        <span class="ear ear-left" aria-hidden="true"></span>
        <span class="ear ear-right" aria-hidden="true"></span>
        <span class="head" aria-hidden="true">
          <span id="control-symbol" class="play-symbol">▶</span>
        </span>
      </button>

      <p id="status" class="status" role="status" aria-live="polite">Ready</p>
    </section>

    <audio id="park-audio" preload="none" playsinline></audio>
  </main>
  <script src="park-music.js?v=001"></script>
</body>
</html>
