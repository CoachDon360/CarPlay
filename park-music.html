<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071a3d">
  <title>Park Music</title>
  <link rel="stylesheet" href="park-music.css?v=006">
</head>
<body>
  <main class="park-player">
    <div id="background-day" class="background-layer background-day" aria-hidden="true"></div>
    <div id="background-night" class="background-layer background-night" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <section class="audio-panel" aria-label="Park Music player">
      <div class="now-playing" aria-live="polite">
        <div class="music-mark" aria-hidden="true">
          <span class="spark spark-left">✦</span>
          <span class="music-note">♪</span>
          <span class="spark spark-right">✦</span>
        </div>
        <p id="track-meta" class="metadata">Streaming Live</p>
      </div>

      <button id="play-button" class="mouse-control" type="button" aria-label="Play Park Music" aria-pressed="false">
        <span class="ear ear-left" aria-hidden="true"></span>
        <span class="ear ear-right" aria-hidden="true"></span>
        <span class="head" aria-hidden="true">
          <span id="control-symbol" class="play-symbol">▶</span>
        </span>
      </button>

      <p id="status" class="status" role="status" aria-live="polite">Ready</p>
    </section>

    <audio id="park-audio" preload="none" playsinline></audio>
  </main>
  <script src="park-music.js?v=006"></script>
</body>
</html>
