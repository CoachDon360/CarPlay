<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071d55">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nexit</title>
  <link rel="stylesheet" href="nexit.css?v=014">
</head>
<body>
  <main class="app-shell">
    
    <header class="app-header">
      <a class="back-button" href="index.html" aria-label="Back to CarPlay home">‹</a>

      <div class="brand sign-brand">
        <img src="next-exit-sign.png" alt="Next Exit">
      </div>

      <div class="trip-status" id="trip-status" aria-label="Trip status" aria-live="polite">
        <span>INTERSTATE</span>
        <strong id="interstate-status">Locating…</strong>
        <small id="location-detail">Requesting location</small>
      </div>
    </header>

    <section class="purpose-panel" aria-labelledby="purpose-title">
      <p class="eyebrow">CHOOSE A PURPOSE</p>
      <h2 id="purpose-title">What do you need ahead?</h2>

      <div class="purpose-grid">
        <button class="purpose-card" type="button" data-purpose="restroom">
          <span class="icon-frame">
            <img src="nexit-restroom.png" alt="" aria-hidden="true">
          </span>
          <span class="purpose-label">Restroom</span>
        </button>

        <button class="purpose-card" type="button" data-purpose="food">
          <span class="icon-frame">
            <img src="nexit-food.png" alt="" aria-hidden="true">
          </span>
          <span class="purpose-label">Food</span>
        </button>

        <button class="purpose-card" type="button" data-purpose="superchargers">
          <span class="icon-frame">
            <img src="nexit-supercharger.png" alt="" aria-hidden="true">
          </span>
          <span class="purpose-label">Superchargers</span>
        </button>
      </div>
    </section>

    <section class="phase-panel" aria-live="polite">
      <div>
        <p class="eyebrow">PHASE ONE</p>
        <h2 id="selection-title">Select a purpose</h2>
        <p id="selection-copy">
          Live location, interstate detection, and upcoming exit recommendations
          will be connected one building block at a time.
        </p>
      </div>

      <button class="future-button" type="button" disabled>
        Recommendations coming next
      </button>
    </section>
  </main>

  <script src="nexit.js?v=014"></script>
</body>
</html>
