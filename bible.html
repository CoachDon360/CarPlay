<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible</title>
  <link rel="stylesheet" href="bible.css?v=001">

  <style>
    /* Tiny patch v2: Verse of the Day card only */
    .top-bar .verse-content {
      display: none;
    }

    .side-menu {
      overflow-y: auto;
    }

    .verse-card {
      flex: 0 0 auto;
      width: 100%;
      margin: 0 0 12px;
      padding: clamp(16px, 2vw, 24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      background: #17191d;
      color: #fff;
      text-align: left;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .verse-card-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      color: #4da3ff;
      font-size: clamp(14px, 1.45vw, 20px);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .daily-sun {
      position: relative;
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
    }

    .daily-sun::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 2px solid #fff;
      border-radius: 50%;
    }

    .daily-sun span,
    .daily-sun::after {
      position: absolute;
      inset: 0;
      content: "";
      background:
        linear-gradient(#fff, #fff) center top / 2px 5px no-repeat,
        linear-gradient(#fff, #fff) center bottom / 2px 5px no-repeat,
        linear-gradient(90deg, #fff, #fff) left center / 5px 2px no-repeat,
        linear-gradient(90deg, #fff, #fff) right center / 5px 2px no-repeat;
    }

    .daily-sun span {
      transform: rotate(45deg);
    }

    .verse-card-reference {
      margin-bottom: 10px;
      color: #fff;
      font-size: clamp(21px, 2.15vw, 31px);
      font-weight: 650;
      line-height: 1.15;
    }

    .verse-card-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(16px, 1.55vw, 22px);
      line-height: 1.42;
    }

    @media (max-width: 760px), (max-height: 560px) {
      .verse-card {
        margin-bottom: 8px;
        padding: 13px 15px;
        border-radius: 16px;
      }

      .verse-card-heading {
        margin-bottom: 9px;
        gap: 9px;
      }

      .daily-sun {
        width: 21px;
        height: 21px;
        flex-basis: 21px;
      }

      .daily-sun::before {
        inset: 6px;
      }

      .verse-card-reference {
        margin-bottom: 6px;
      }
    }

    /* Tiny patch v3: navy Bible header + slightly wider left column */
    .top-bar {
      position: relative;
      display: grid;
      grid-template-columns: 72px 1fr 72px;
      align-items: center;
      width: 100%;
      min-height: 72px;
      padding: 0 18px;
      border: 0;
      border-radius: 0 0 18px 18px;
      background: #123f73;
      color: #fff;
      box-sizing: border-box;
    }

    .top-bar .back-button {
      position: static;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
    }

    .top-bar .back-button > span:last-child {
      display: none;
    }

    .top-bar .back-arrow {
      color: #fff;
      font-size: 48px;
      font-weight: 300;
      line-height: 1;
      transform: translateY(-2px);
    }

    .bible-page-title {
      margin: 0;
      color: #fff;
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 650;
      line-height: 1;
      text-align: center;
      letter-spacing: 0.01em;
    }

    .header-bible-icon {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: #fff;
    }

    .header-bible-icon svg {
      display: block;
      width: 43px;
      height: 43px;
      overflow: visible;
    }

    /* Give the verse/navigation column a little more breathing room. */
    .app-shell {
      grid-template-columns: minmax(370px, 39%) 2px minmax(0, 1fr);
    }

    @media (max-width: 900px) {
      .app-shell {
        grid-template-columns: minmax(330px, 42%) 2px minmax(0, 1fr);
      }
    }

    @media (max-width: 760px), (max-height: 560px) {
      .top-bar {
        min-height: 60px;
        grid-template-columns: 58px 1fr 58px;
        padding: 0 12px;
        border-radius: 0 0 14px 14px;
      }

      .top-bar .back-button {
        width: 44px;
        height: 44px;
      }

      .top-bar .back-arrow {
        font-size: 40px;
      }

      .header-bible-icon svg {
        width: 36px;
        height: 36px;
      }

      .app-shell {
        grid-template-columns: minmax(300px, 43%) 2px minmax(0, 1fr);
      }
    }


    /* Tiny patch v4: header balance, subtitle, unified blues, spacing, card footer */
    :root {
      --bible-primary-blue: #1d4f86;
      --bible-accent-blue: #4da3ff;
      --bible-selected-blue: rgba(29, 79, 134, 0.58);
    }

    .top-bar {
      background: var(--bible-primary-blue);
      min-height: 82px;
      grid-template-columns: 72px 1fr 72px;
    }

    .top-bar .back-button,
    .header-bible-icon {
      height: 100%;
      align-self: stretch;
      display: flex;
      align-items: center;
    }

    .top-bar .back-button {
      justify-content: flex-start;
    }

    .top-bar .back-arrow {
      display: block;
      transform: none;
      line-height: 1;
      margin-top: 0;
    }

    .header-bible-icon {
      justify-content: flex-end;
    }

    .bible-title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      text-align: center;
    }

    .bible-page-title {
      line-height: 1.05;
    }

    .bible-page-subtitle {
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(12px, 1.15vw, 16px);
      font-weight: 550;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .verse-card {
      margin-bottom: 24px;
    }

    .verse-card-heading {
      color: var(--bible-accent-blue);
    }

    .verse-card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .read-chapter-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 8px 16px;
      border: 1px solid var(--bible-accent-blue);
      border-radius: 999px;
      background: transparent;
      color: var(--bible-accent-blue);
      font: inherit;
      font-size: clamp(14px, 1.25vw, 18px);
      font-weight: 650;
      cursor: pointer;
    }

    .read-chapter-button:hover,
    .read-chapter-button:focus-visible {
      background: rgba(77, 163, 255, 0.10);
    }

    .side-menu .menu-item.active,
    .side-menu [aria-current="true"] {
      background: var(--bible-selected-blue);
      border-left-color: var(--bible-accent-blue);
    }

    .app-shell .divider,
    .vertical-divider {
      background: var(--bible-accent-blue);
    }

    @media (max-width: 760px), (max-height: 560px) {
      .top-bar {
        min-height: 58px;
      }

      .bible-page-subtitle {
        margin-top: 3px;
      }

      .verse-card {
        margin-bottom: 16px;
      }

      .verse-card-footer {
        margin-top: 12px;
        padding-top: 11px;
      }
    }


    /* Tiny patch v5: left-column-centered title group + warm yellow accents */
    :root {
      --bible-warm-yellow: #ffd95a;
    }

    .top-bar {
      position: relative;
      display: grid;
      grid-template-columns: 72px minmax(370px, 39%) minmax(0, 1fr);
      align-items: center;
    }

    .bible-brand {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      text-align: center;
    }

    .bible-brand-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .bible-brand-row .header-bible-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
      height: auto;
    }

    .bible-brand-row .header-bible-icon svg {
      width: 38px;
      height: 38px;
    }

    .bible-page-subtitle {
      color: var(--bible-warm-yellow);
    }

    .verse-card-heading {
      color: var(--bible-warm-yellow);
    }

    .top-bar > .header-bible-icon {
      display: none;
    }

    @media (max-width: 900px) {
      .top-bar {
        grid-template-columns: 72px minmax(330px, 42%) minmax(0, 1fr);
      }
    }

    @media (max-width: 760px), (max-height: 560px) {
      .top-bar {
        grid-template-columns: 58px minmax(300px, 43%) minmax(0, 1fr);
      }

      .bible-brand-row {
        gap: 9px;
      }

      .bible-brand-row .header-bible-icon svg {
        width: 32px;
        height: 32px;
      }
    }


    /* Tiny patch v6: back-arrow card + left-shifted Bible brand */
    .top-bar {
      grid-template-columns: 92px minmax(370px, 39%) minmax(0, 1fr);
    }

    .top-bar .back-button {
      justify-self: center;
      align-self: center;
      width: 58px;
      height: 58px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      background: #17191d;
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .top-bar .back-button:hover,
    .top-bar .back-button:focus-visible {
      background: #20242a;
    }

    .top-bar .back-button:active {
      transform: scale(0.97);
    }

    .top-bar .back-arrow {
      font-size: 42px;
      line-height: 1;
      transform: translateY(-1px);
    }

    .bible-brand {
      transform: translateX(-42px);
    }

    .verse-card {
      margin-bottom: 18px;
    }

    @media (max-width: 900px) {
      .top-bar {
        grid-template-columns: 82px minmax(330px, 42%) minmax(0, 1fr);
      }

      .bible-brand {
        transform: translateX(-28px);
      }
    }

    @media (max-width: 760px), (max-height: 560px) {
      .top-bar {
        grid-template-columns: 72px minmax(300px, 43%) minmax(0, 1fr);
      }

      .top-bar .back-button {
        width: 50px;
        height: 50px;
        border-radius: 14px;
      }

      .top-bar .back-arrow {
        font-size: 36px;
      }

      .bible-brand {
        transform: translateX(-18px);
      }

      .verse-card {
        margin-bottom: 14px;
      }
    }


    /* Tiny patch v7: integrated header navigation lane */
    .top-bar {
      grid-template-columns: 78px minmax(370px, 39%) minmax(0, 1fr);
      min-height: 78px;
      padding: 0 18px 0 0;
      overflow: hidden;
    }

    .top-bar .back-button {
      grid-column: 1;
      justify-self: stretch;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 78px;
      height: 100%;
      min-height: 78px;
      margin: 0;
      padding: 0;
      border: 0;
      border-right: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: #fff;
      cursor: pointer;
    }

    .top-bar .back-button:hover,
    .top-bar .back-button:focus-visible {
      background: rgba(255, 255, 255, 0.09);
      outline: none;
    }

    .top-bar .back-button:active {
      transform: none;
      background: rgba(255, 255, 255, 0.14);
    }

    .top-bar .back-arrow {
      display: block;
      color: #fff;
      font-size: 48px;
      font-weight: 300;
      line-height: 1;
      transform: none;
      margin: 0;
      padding: 0 0 3px;
    }

    .bible-brand {
      grid-column: 2;
      align-items: flex-start;
      justify-content: center;
      transform: none;
      padding-left: 24px;
      text-align: left;
    }

    .bible-brand-row {
      justify-content: flex-start;
    }

    .bible-page-title {
      text-align: left;
    }

    @media (max-width: 900px) {
      .top-bar {
        grid-template-columns: 72px minmax(330px, 42%) minmax(0, 1fr);
      }

      .top-bar .back-button {
        width: 72px;
        min-height: 78px;
      }

      .bible-brand {
        transform: none;
        padding-left: 20px;
      }
    }

    @media (max-width: 760px), (max-height: 560px) {
      .top-bar {
        grid-template-columns: 64px minmax(300px, 43%) minmax(0, 1fr);
        min-height: 58px;
      }

      .top-bar .back-button {
        width: 64px;
        min-height: 58px;
        border-radius: 0;
      }

      .top-bar .back-arrow {
        font-size: 42px;
        transform: none;
      }

      .bible-brand {
        transform: none;
        padding-left: 16px;
      }
    }


    /* Tiny patch v8: lock arrow/divider to the full header height */
    .top-bar {
      position: relative;
      padding-left: 78px;
      grid-template-columns: minmax(370px, 39%) minmax(0, 1fr);
    }

    .top-bar .back-button {
      position: absolute;
      inset: 0 auto 0 0;
      width: 78px;
      height: auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      border: 0;
      border-right: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    .top-bar .back-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      color: #fff;
      font-size: 48px;
      font-weight: 300;
      line-height: 1;
      transform: translateY(1px);
    }

    .bible-brand {
      grid-column: 1;
    }

    @media (max-width: 900px) {
      .top-bar {
        padding-left: 72px;
        grid-template-columns: minmax(330px, 42%) minmax(0, 1fr);
      }

      .top-bar .back-button {
        width: 72px;
      }
    }

    @media (max-width: 760px), (max-height: 560px) {
      .top-bar {
        padding-left: 64px;
        grid-template-columns: minmax(300px, 43%) minmax(0, 1fr);
      }

      .top-bar .back-button {
        width: 64px;
      }

      .top-bar .back-arrow {
        font-size: 42px;
        transform: translateY(1px);
      }
    }


    /* v9 — one clean, self-contained header component */
    .bible-header-v9 {
      box-sizing: border-box;
      display: flex;
      align-items: stretch;
      width: 100%;
      height: 132px;
      min-height: 132px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 0 0 34px 34px;
      background: #255a91;
      color: #fff;
    }

    .bible-header-v9__back {
      position: relative;
      box-sizing: border-box;
      flex: 0 0 138px;
      width: 138px;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    .bible-header-v9__back::after {
      content: "";
      position: absolute;
      top: 18px;
      right: 0;
      bottom: 18px;
      width: 1px;
      background: rgba(255,255,255,.20);
    }

    .bible-header-v9__back:hover,
    .bible-header-v9__back:focus-visible {
      background: rgba(255,255,255,.08);
      outline: none;
    }

    .bible-header-v9__back:active {
      background: rgba(255,255,255,.13);
    }

    .bible-header-v9__arrow {
      display: block;
      width: 48px;
      height: 48px;
      margin: 0;
      overflow: visible;
    }

    .bible-header-v9__arrow path {
      fill: none;
      stroke: currentColor;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bible-header-v9__brand {
      box-sizing: border-box;
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      padding: 18px 26px 14px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
    }

    .bible-header-v9__title-row {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .bible-header-v9__book {
      display: block;
      flex: 0 0 58px;
      width: 58px;
      height: 58px;
      overflow: visible;
    }

    .bible-header-v9__book path {
      fill: none;
      stroke: currentColor;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bible-header-v9__book path:last-child {
      stroke-width: 2.4;
      opacity: .9;
    }

    .bible-header-v9__title {
      margin: 0;
      padding: 0;
      color: #fff;
      font-size: clamp(42px, 4.7vw, 64px);
      font-weight: 700;
      line-height: .95;
      letter-spacing: 0;
      text-align: left;
    }

    .bible-header-v9__subtitle {
      margin: 8px 0 0;
      padding: 0;
      color: #ffd95a;
      font-size: clamp(19px, 2vw, 28px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: .09em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .bible-header-v9 {
        height: 126px;
        min-height: 126px;
        border-radius: 0 0 26px 26px;
      }

      .bible-header-v9__back {
        flex-basis: 118px;
        width: 118px;
      }

      .bible-header-v9__back::after {
        top: 18px;
        bottom: 18px;
      }

      .bible-header-v9__arrow {
        width: 42px;
        height: 42px;
      }

      .bible-header-v9__brand {
        padding: 18px 20px 14px 34px;
      }

      .bible-header-v9__title-row {
        gap: 18px;
      }

      .bible-header-v9__book {
        flex-basis: 58px;
        width: 58px;
        height: 58px;
      }

      .bible-header-v9__subtitle {
        margin-top: 10px;
      }
    }

    @media (max-width: 760px), (max-height: 560px) {
      .bible-header-v9 {
        height: 104px;
        min-height: 104px;
        border-radius: 0 0 20px 20px;
      }

      .bible-header-v9__back {
        flex-basis: 86px;
        width: 86px;
      }

      .bible-header-v9__back::after {
        top: 14px;
        bottom: 14px;
      }

      .bible-header-v9__arrow {
        width: 34px;
        height: 34px;
      }

      .bible-header-v9__brand {
        padding: 13px 16px 11px 24px;
      }

      .bible-header-v9__title-row {
        gap: 13px;
      }

      .bible-header-v9__book {
        flex-basis: 45px;
        width: 45px;
        height: 45px;
      }

      .bible-header-v9__subtitle {
        margin-top: 7px;
        letter-spacing: .07em;
      }
    }

  </style>
</head>
<body>
  <header class="bible-header-v9" aria-label="Bible header">
    <button class="bible-header-v9__back" id="bibleBackV9" type="button" aria-label="Go back">
      <svg class="bible-header-v9__arrow" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M20 7 11 16l9 9" />
      </svg>
    </button>

    <div class="bible-header-v9__brand">
      <div class="bible-header-v9__title-row">
        <svg class="bible-header-v9__book" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 16c-6.2-5.2-14.7-7.3-23-5.5v36.2c8.2-1.8 16.8.3 23 5.5V16Z"/>
          <path d="M32 16c6.2-5.2 14.7-7.3 23-5.5v36.2c-8.2-1.8-16.8.3-23 5.5V16Z"/>
          <path d="M32 16v36.2"/>
          <path d="M14 20.5c4.7-.5 9.4.5 13.3 2.9M14 29c4.7-.5 9.4.5 13.3 2.9M50 20.5c-4.7-.5-9.4.5-13.3 2.9M50 29c-4.7-.5-9.4.5-13.3 2.9"/>
        </svg>
        <h1 class="bible-header-v9__title">Bible</h1>
      </div>
      <div class="bible-header-v9__subtitle">Read • Listen • Pray</div>
    </div>
  </header>

  <main class="app-shell" aria-label="Bible navigation">
    <nav class="side-menu" aria-label="Bible sections">
      <section class="verse-card" aria-label="Verse of the Day">
        <div class="verse-card-heading">
          <span class="daily-sun" aria-hidden="true"><span></span></span>
          <span>Verse of the Day</span>
        </div>

        <div class="verse-card-reference" id="verseReference">Psalm 46:10</div>

        <div class="verse-card-text" id="verseText">
          “Be still, and know that I am God.”
        </div>

        <div class="verse-card-footer">
          <button class="read-chapter-button" type="button" aria-label="Read the full chapter">
            <span>Read Chapter</span>
            <span aria-hidden="true">→</span>
          </button>
