<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible</title>
  <link rel="stylesheet" href="bible.css?v=001">

  <style>
    /* Tiny patch v2: Verse of the Day card only */
    .top-bar .verse-content {
      display: none;
    }

    .side-menu {
      overflow-y: auto;
    }

    .verse-card {
      flex: 0 0 auto;
      width: 100%;
      margin: 0 0 12px;
      padding: clamp(16px, 2vw, 24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      background: #17191d;
      color: #fff;
      text-align: left;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .verse-card-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      color: #4da3ff;
      font-size: clamp(14px, 1.45vw, 20px);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .daily-sun {
      position: relative;
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
    }

    .daily-sun::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 2px solid #fff;
      border-radius: 50%;
    }

    .daily-sun span,
    .daily-sun::after {
      position: absolute;
      inset: 0;
      content: "";
      background:
        linear-gradient(#fff, #fff) center top / 2px 5px no-repeat,
        linear-gradient(#fff, #fff) center bottom / 2px 5px no-repeat,
        linear-gradient(90deg, #fff, #fff) left center / 5px 2px no-repeat,
        linear-gradient(90deg, #fff, #fff) right center / 5px 2px no-repeat;
    }

    .daily-sun span {
      transform: rotate(45deg);
    }

    .verse-card-reference {
      margin-bottom: 10px;
      color: #fff;
      font-size: clamp(21px, 2.15vw, 31px);
      font-weight: 650;
      line-height: 1.15;
    }

    .verse-card-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(16px, 1.55vw, 22px);
      line-height: 1.42;
    }

    @media (max-width: 760px), (max-height: 560px) {
      .verse-card {
        margin-bottom: 8px;
        padding: 13px 15px;
        border-radius: 16px;
      }

      .verse-card-heading {
        margin-bottom: 9px;
        gap: 9px;
      }

      .daily-sun {
        width: 21px;
        height: 21px;
        flex-basis: 21px;
      }

      .daily-sun::before {
        inset: 6px;
      }

      .verse-card-reference {
        margin-bottom: 6px;
      }
    }

    /* Tiny patch v3: navy Bible header + slightly wider left column */
    .top-bar {
      position: relative;
      display: grid;
      grid-template-columns: 72px 1fr 72px;
      align-items: center;
      width: 100%;
      min-height: 72px;
      padding: 0 18px;
      border: 0;
      border-radius: 0 0 18px 18px;
      background: #123f73;
      color: #fff;
      box-sizing: border-box;
    }

    .top-bar .back-button {
      position: static;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
    }

    .top-bar .back-button > span:last-child {
      display: none;
    }

    .top-bar .back-arrow {
      color: #fff;
      font-size: 48px;
      font-weight: 300;
      line-height: 1;
      transform: translateY(-2px);
    }

    .bible-page-title {
      margin: 0;
      color: #fff;
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 650;
      line-height: 1;
      text-align: center;
      letter-spacing: 0.01em;
    }

    .header-bible-icon {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: #fff;
    }

    .header-bible-icon svg {
      display: block;
      width: 43px;
      height: 43px;
      overflow: visible;
    }

    /* Give the verse/navigation column a little more breathing room. */
    .app-shell {
      grid-template-columns: minmax(370px, 39%) 2px minmax(0, 1fr);
    }

    @media (max-width: 900px) {
      .app-shell {
        grid-template-columns: minmax(330px, 42%) 2px minmax(0, 1fr);
      }
    }

    @media (max-width: 760px), (max-height: 560px) {
      .top-bar {
        min-height: 60px;
        grid-template-columns: 58px 1fr 58px;
        padding: 0 12px;
        border-radius: 0 0 14px 14px;
      }

      .top-bar .back-button {
        width: 44px;
        height: 44px;
      }

      .top-bar .back-arrow {
        font-size: 40px;
      }

      .header-bible-icon svg {
        width: 36px;
        height: 36px;
      }

      .app-shell {
        grid-template-columns: minmax(300px, 43%) 2px minmax(0, 1fr);
      }
    }


    /* Tiny patch v4: header balance, subtitle, unified blues, spacing, card footer */
    :root {
      --bible-primary-blue: #1d4f86;
      --bible-accent-blue: #4da3ff;
      --bible-selected-blue: rgba(29, 79, 134, 0.58);
    }

    .top-bar {
      background: var(--bible-primary-blue);
      min-height: 82px;
      grid-template-columns: 72px 1fr 72px;
    }

    .top-bar .back-button,
    .header-bible-icon {
      height: 100%;
      align-self: stretch;
      display: flex;
      align-items: center;
    }

    .top-bar .back-button {
      justify-content: flex-start;
    }

    .top-bar .back-arrow {
      display: block;
      transform: none;
      line-height: 1;
      margin-top: 0;
    }

    .header-bible-icon {
      justify-content: flex-end;
    }

    .bible-title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      text-align: center;
    }

    .bible-page-title {
      line-height: 1.05;
    }

    .bible-page-subtitle {
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(12px, 1.15vw, 16px);
      font-weight: 550;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .verse-card {
      margin-bottom: 24px;
    }

    .verse-card-heading {
      color: var(--bible-accent-blue);
    }

    .verse-card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .read-chapter-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 8px 16px;
      border: 1px solid var(--bible-accent-blue);
      border-radius: 999px;
      background: transparent;
      color: var(--bible-accent-blue);
      font: inherit;
      font-size: clamp(14px, 1.25vw, 18px);
      font-weight: 650;
      cursor: pointer;
    }

    .read-chapter-button:hover,
    .read-chapter-button:focus-visible {
      background: rgba(77, 163, 255, 0.10);
    }

    .side-menu .menu-item.active,
    .side-menu [aria-current="true"] {
      background: var(--bible-selected-blue);
      border-left-color: var(--bible-accent-blue);
    }

    .app-shell .divider,
    .vertical-divider {
      background: var(--bible-accent-blue);
    }

    @media (max-width: 760px), (max-height: 560px) {
      .top-bar {
        min-height: 70px;
      }

      .bible-page-subtitle {
        margin-top: 3px;
      }

      .verse-card {
        margin-bottom: 16px;
      }

      .verse-card-footer {
        margin-top: 12px;
        padding-top: 11px;
      }
    }


    /* Tiny patch v5: left-column-centered title group + warm yellow accents */
    :root {
      --bible-warm-yellow: #ffd95a;
    }

    .top-bar {
      position: relative;
      display: grid;
      grid-template-columns: 72px minmax(370px, 39%) minmax(0, 1fr);
      align-items: center;
    }

    .bible-brand {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      text-align: center;
    }

    .bible-brand-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .bible-brand-row .header-bible-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
      height: auto;
    }

    .bible-brand-row .header-bible-icon svg {
      width: 38px;
      height: 38px;
    }

    .bible-page-subtitle {
      color: var(--bible-warm-yellow);
    }

    .verse-card-heading {
      color: var(--bible-warm-yellow);
    }

    .top-bar > .header-bible-icon {
      display: none;
    }

    @media (max-width: 900px) {
      .top-bar {
        grid-template-columns: 72px minmax(330px, 42%) minmax(0, 1fr);
      }
    }

    @media (max-width: 760px), (max-height: 560px) {
      .top-bar {
        grid-template-columns: 58px minmax(300px, 43%) minmax(0, 1fr);
      }

      .bible-brand-row {
        gap: 9px;
      }

      .bible-brand-row .header-bible-icon svg {
        width: 32px;
        height: 32px;
      }
    }

  </style>
</head>
<body>
  <header class="top-bar" aria-label="Bible header">
    <button class="back-button" id="backButton" type="button" aria-label="Go back">
      <span class="back-arrow" aria-hidden="true">‹</span>
      <span>Back</span>
    </button>

    <div class="bible-brand">
      <div class="bible-brand-row">
        <div class="header-bible-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <path d="M32 16c-6.2-5.2-14.7-7.3-23-5.5v36.2c8.2-1.8 16.8.3 23 5.5V16Z"
                  fill="none" stroke="currentColor" stroke-width="3.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M32 16c6.2-5.2 14.7-7.3 23-5.5v36.2c-8.2-1.8-16.8.3-23 5.5V16Z"
                  fill="none" stroke="currentColor" stroke-width="3.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M32 16v36.2"
                  fill="none" stroke="currentColor" stroke-width="3.5"
                  stroke-linecap="round"/>
            <path d="M14 20.5c4.7-.5 9.4.5 13.3 2.9M14 29c4.7-.5 9.4.5 13.3 2.9M50 20.5c-4.7-.5-9.4.5-13.3 2.9M50 29c-4.7-.5-9.4.5-13.3 2.9"
                  fill="none" stroke="currentColor" stroke-width="2.4"
                  stroke-linecap="round" opacity=".9"/>
          </svg>
        </div>
        <h1 class="bible-page-title">Bible</h1>
      </div>
      <div class="bible-page-subtitle">Read • Listen • Pray</div>
    </div>
  </header>

  <main class="app-shell" aria-label="Bible navigation">
    <nav class="side-menu" aria-label="Bible sections">
      <section class="verse-card" aria-label="Verse of the Day">
        <div class="verse-card-heading">
          <span class="daily-sun" aria-hidden="true"><span></span></span>
          <span>Verse of the Day</span>
        </div>

        <div class="verse-card-reference" id="verseReference">Psalm 46:10</div>

        <div class="verse-card-text" id="verseText">
          “Be still, and know that I am God.”
        </div>

        <div class="verse-card-footer">
          <button class="read-chapter-button" type="button" aria-label="Read the full chapter">
            <span>Read Chapter</span>
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <button class="menu-item active" type="button" data-section="law">
        <span class="menu-title">The Law</span>
        <span class="menu-subtitle">Genesis–Deuteronomy</span>
      </button>

      <button class="menu-item" type="button" data-section="history">
        <span class="menu-title">History</span>
        <span class="menu-subtitle">Joshua–Esther</span>
      </button>

      <button class="menu-item" type="button" data-section="wisdom">
        <span class="menu-title">Poetry &amp; Wisdom</span>
        <span class="menu-subtitle">Job–Song of Songs</span>
      </button>

      <button class="menu-item" type="button" data-section="prophets">
        <span class="menu-title">Prophets</span>
        <span class="menu-subtitle">Isaiah–Malachi</span>
      </button>

      <button class="menu-item" type="button" data-section="new-testament">
        <span class="menu-title">New Testament</span>
        <span class="menu-subtitle">Matthew–Revelation</span>
      </button>

      <button class="menu-item" type="button" data-section="insight">
        <span class="menu-title">Insight for Living</span>
        <span class="menu-subtitle">Sermons</span>
      </button>
    </nav>

    <div class="panel-divider" aria-hidden="true"></div>
    <section class="content-panel" aria-live="polite">
    </section>
  </main>
  <script src="bible.js?v=001"></script>
  <script src="verse-of-the-day-test.js?v=001"></script>

  <footer class="footer-banner">
    <div class="mission">
      Unleash the full force of the church to love people one at a time.
    </div>

    <div class="themes">
      <span>Be the Branch</span>
      <span class="footer-divider">|</span>
      <span>Catch the Wind</span>
      <span class="footer-divider">|</span>
      <span>Wreck the Roof</span>
      <span class="footer-divider">|</span>
      <span>Grip the Plow</span>
      <span class="footer-divider">|</span>
      <span>Empty the Jar</span>
    </div>
  </footer>
</body>
</html>
